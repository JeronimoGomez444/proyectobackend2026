spring.application.name=tracking-envios-api

# Conexion a PostgreSQL (la contrasena viene de la variable de entorno DB_PASSWORD)
spring.datasource.url=jdbc:postgresql://localhost:5432/tracking_envios_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate (ddl-auto=update solo para esta etapa de aprendizaje)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true